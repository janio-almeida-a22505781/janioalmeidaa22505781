{% load static %}

<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Janio.dev
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/artigos/">Artigos</a>

            {% if user.is_authenticated %}

                <a href="/artigos/criar/">
                    Novo Artigo
                </a>

                <a href="/admin/">
                    Admin
                </a>

            {% else %}

                <a href="/login/">
                    Login
                </a>

                <a href="/register/">
                    Registo
                </a>

            {% endif %}

        </div>

    </nav>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
